spring:
  application:
    name: interviewiq-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema truth lives in Flyway migrations, never in Hibernate auto-DDL
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    # Jackson 3 (Spring Boot 4) serializes java.time types as ISO-8601 strings
    # by default — no explicit write-dates-as-timestamps toggle needed/available.
    deserialization:
      # Jackson 3 flipped this feature's default to true (Jackson 2 defaulted to
      # false) — without this, any request DTO with an optional primitive field
      # (e.g. `boolean rememberMe`) 500s instead of defaulting when the client
      # omits it. Restores the Jackson 2 behavior every prior Spring Boot app expects.
      fail-on-null-for-primitives: false

  servlet:
    multipart:
      max-file-size: 10MB # resume uploads
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# InterviewIQ-specific configuration, bound via @ConfigurationProperties (see config/ package)
interviewiq:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
    remember-me-refresh-token-ttl-days: 90
    # the refresh-token cookie's Secure flag — browsers drop Secure cookies over plain
    # HTTP, so this must stay false for local/staging-without-TLS and only flip on
    # where a real TLS-terminating deployment exists (production).
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  auth:
    email-verification-token-ttl-hours: 24
    # Cheap, self-contained abuse mitigation for /auth/resend-verification — a caller
    # could otherwise email-bomb any known address with unlimited resends. Real rate
    # limiting (Redis token bucket, docs/ARCHITECTURE.md §6) doesn't exist anywhere in
    # this codebase yet; this cooldown isn't a substitute, just a proportionate stopgap.
    email-verification-resend-cooldown-seconds: 60
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
  ai:
    provider: ${AI_PROVIDER:openai} # openai | gemini
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4.1
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.0-flash
  rate-limit:
    default-requests-per-minute: 60
    ai-endpoint-requests-per-minute: 10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    resume-upload-dir: ${RESUME_UPLOAD_DIR:/app/uploads/resumes}
  notification:
    mail-from: ${MAIL_FROM:no-reply@interviewiq.ai}
