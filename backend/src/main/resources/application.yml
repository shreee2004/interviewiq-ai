spring:
  application:
    name: interviewiq-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema truth lives in Flyway migrations, never in Hibernate auto-DDL
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB # resume uploads
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# InterviewIQ-specific configuration, bound via @ConfigurationProperties (see config/ package)
interviewiq:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
    remember-me-refresh-token-ttl-days: 90
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
  ai:
    provider: ${AI_PROVIDER:openai} # openai | gemini
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4.1
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.0-flash
  rate-limit:
    default-requests-per-minute: 60
    ai-endpoint-requests-per-minute: 10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
