# Staging profile — managed Postgres/Redis, all secrets from environment. No values are
# hardcoded here; deployment injects DB_*, REDIS_*, JWT_SECRET, *_API_KEY, etc.
interviewiq:
  jwt:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    root: INFO
    com.interviewiq: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
